<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Resume Preview</title>
<link rel="stylesheet" href="student_resume.css">

</head>

<body>

<div class="container">
    <div class="page-title">
        <h1>📄 Your Professional Resume</h1>
        <p>Preview, save, and export your resume</p>
    </div>

    <div id="resumePreview">
        <!-- Resume content will be dynamically inserted here -->
        <div class="empty-state">
            <p>Loading your resume...</p>
        </div>
    </div>

    <div class="action-buttons">
        <button id="finishBtn" class="btn btn-primary">
            💾 Save to Database
        </button>
        <button id="downloadPdf" class="btn btn-secondary">
            📥 Download PDF
        </button>
        <button id="printBtn" class="btn btn-success">
            🖨️ Print Resume
        </button>
    </div>
</div>

<!-- PDF Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<script>
document.addEventListener("DOMContentLoaded", function() {

    const preview = document.getElementById("resumePreview");

    const personalInfo = JSON.parse(localStorage.getItem("personalInfo")) || {};
    const summary = localStorage.getItem("summary") || "";
    const education = JSON.parse(localStorage.getItem("education")) || [];
    const experiences = JSON.parse(localStorage.getItem("experiences")) || [];
    const certificates = JSON.parse(localStorage.getItem("certificates")) || [];
    const languages = JSON.parse(localStorage.getItem("languages")) || [];
    const activities = JSON.parse(localStorage.getItem("activities")) || [];

    // Build Resume HTML
    preview.innerHTML = `
        <h1>${personalInfo.name || ""}</h1>
        <p>${personalInfo.email || ""} | ${personalInfo.phone || ""}</p>
        <p>${personalInfo.city || ""} ${personalInfo.region || ""}</p>

        <div class="section">
            <h2>Professional Summary</h2>
            <p>${summary}</p>
        </div>

        <div class="section">
            <h2>Education</h2>
            ${education.map(e => `
                <p><strong>${e.diploma}</strong> - ${e.institution} (${e.year})</p>
            `).join("")}
        </div>

        <div class="section">
            <h2>Experience</h2>
            ${experiences.map(exp => `
                <p><strong>${exp.jobTitle}</strong> - ${exp.company}</p>
                <p>${exp.description}</p>
            `).join("")}
        </div>

        <div class="section">
            <h2>Certificates</h2>
            ${certificates.map(c => `
                <p>${c.name} (${c.year})</p>
            `).join("")}
        </div>

        <div class="section">
            <h2>Languages</h2>
            ${languages.map(l => `
                <p>${l.language} - ${l.level}</p>
            `).join("")}
        </div>

        <div class="section">
            <h2>Activities</h2>
            ${activities.map(a => `
                <p><strong>${a.activity}</strong>: ${a.description}</p>
            `).join("")}
        </div>
    `;

});


// SAVE TO MONGODB
document.getElementById("finishBtn")?.addEventListener("click", async function() {

    const resumeData = {
        personalInfo: JSON.parse(localStorage.getItem("personalInfo")),
        summary: localStorage.getItem("summary"),
        education: JSON.parse(localStorage.getItem("education")) || [],
        experiences: JSON.parse(localStorage.getItem("experiences")) || [],
        certificates: JSON.parse(localStorage.getItem("certificates")) || [],
        languages: JSON.parse(localStorage.getItem("languages")) || [],
        activities: JSON.parse(localStorage.getItem("activities")) || []
    };

    const response = await fetch("/api/resumes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(resumeData)
    });

    const data = await response.json();

    alert("Resume Saved Successfully!");
    console.log("Saved Resume ID:", data._id);

    localStorage.clear();
});


// EXPORT TO PDF
document.getElementById("downloadPdf").addEventListener("click", function() {

    const { jsPDF } = window.jspdf;

    html2canvas(document.querySelector("#resumePreview")).then(canvas => {
        const imgData = canvas.toDataURL("image/png");
        const pdf = new jsPDF("p", "mm", "a4");

        const imgWidth = 190;
        const pageHeight = 295;
        const imgHeight = canvas.height * imgWidth / canvas.width;

        pdf.addImage(imgData, "PNG", 10, 10, imgWidth, imgHeight);
        pdf.save("resume.pdf");
    });

});
</script>

</body>
</html>
