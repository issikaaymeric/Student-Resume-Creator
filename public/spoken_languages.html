<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Resume Creation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <div class="page_title">
            <h1>Student Resume Creation</h1>
            <h2>Create Your Professional Resume</h2>
        </div>

        <button id="btn_back" onclick="return_back()">Back</button>

        <h2>Spoken Languages</h2>
        <p>Tell us about the languages you speak and your proficiency in each.</p>

        <div class="spoken_languages_form">
            <form id="languagesForm">
                <label for="language">Language:</label>
                <input type="text" id="language" name="language">
                
                <label for="proficiency_rating">Proficiency rating:</label>
                <input type="text" id="proficiency_rating" name="proficiency_rating">

                <button type="submit" id="btn_next">Next</button>
                
            </form>


            <button id="addLanguage" onclick="addLanguage()">Add Language</button>
            <button id="removeLanguage" onclick="removeLanguage()">Remove Language</button>

        </div>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
