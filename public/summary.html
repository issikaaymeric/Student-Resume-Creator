<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Resume Creation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="page_title">
        <h1>Student Resume Creation</h1>
        <h2>Create Your Professional Resume</h2>
    </div>

    <button id="btn_back">Back</button>

    <h2>Summary</h2>
    <p>Provide a brief summary of your professional background and goals.</p>

    <div class="summary_form">
        <form id="summaryForm">
            <label for="summary">Summary:</label>
            <textarea id="summary" name="summary" rows="10" cols="50" placeholder="Enter a summary of your professional background and goals"></textarea>
        </form>
        <button type="submit" id="btn_next">Next</button>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
