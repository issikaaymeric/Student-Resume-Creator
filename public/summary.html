<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Resume Creation</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" 
  href="data:image/svg+xml,<svg xmlns='http://www.w3.org' viewBox='0 0 512 512'><path fill='%23000' d='M176 56V96H336V56c0-4.4-3.6-8-8-8H184c-4.4 0-8 3.6-8 8zM128 96V56c0-30.9 25.1-56 56-56H328c30.9 0 56 25.1 56 56V96h64c35.3 0 64 28.7 64 64V448c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V160c0-35.3 28.7-64 64-64h64z'/></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="page_title">
        <h1>Student Resume Creation</h1>
        <h2>Create Your Professional Resume</h2>
    </div>

    <button id="btn_back">Back</button>

    <h2>Summary</h2>
    <p>Provide a brief summary of your professional background and goals.</p>

    <div class="summary_form">
        <form id="summaryForm">
            <label for="summary">Summary:</label>
            <textarea id="summary" name="summary" rows="10" cols="50" placeholder="Enter a summary of your professional background and goals"></textarea>
        </form>
        <button type="submit" id="btn_next">Next</button>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
