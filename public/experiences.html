<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Resume Creation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="page_title">
        <h1>Student Resume Creation</h1>
        <h2>Create Your Professional Resume</h2>
    </div>

    <button id="btn_back" onclick="return_back()">Back</button>

    <h2>Work Experiences</h2>
    <p>Tell us about your work experiences.</p>

    <div class="experiences_form">
        <form id="experienceForm">
            <label for="job_title">Job Title:</label>
            <input type="text" id="job_title" name="job_title">
            
            <label for="company">Company:</label>
            <input type="text" id="company" name="company">

            <label for="company_city">City:</label>
            <input type="text" id="company_city" name="company_city">
            
            <label for="start_date">Start Date:</label>
            <input type="date" id="start_date" name="start_date">
            
            <label for="end_date">End Date:</label>
            <input type="date" id="end_date" name="end_date">

            <label for="achievements">Achievements:</label>
            <input type="text" id="achievements" name="achievements">

            <button type="submit" id="btn_next">Next</button>
            
        </form>


        <button id="addExperience" onclick="addExperience()">Add Experience</button>
        <button id="removeExperience" onclick="removeExperience()">Remove Experience</button>
    </div>
</div>

<script src="scripts.js"></script>
    
</body>
</html>
