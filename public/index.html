<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Resume Creation</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" 
  href="data:image/svg+xml,<svg xmlns='http://www.w3.org' viewBox='0 0 512 512'><path fill='%23000' d='M176 56V96H336V56c0-4.4-3.6-8-8-8H184c-4.4 0-8 3.6-8 8zM128 96V56c0-30.9 25.1-56 56-56H328c30.9 0 56 25.1 56 56V96h64c35.3 0 64 28.7 64 64V448c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V160c0-35.3 28.7-64 64-64h64z'/></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <div class="page_title">
            <h1>Student Resume Creation</h1>
            <h2>Create Your Professional Resume</h2>
        </div>

        <div class="address_form">
            <form id="resumeForm">
                <label for="name">Fullname:</label>
                <input type="text" id="name" name="name" required><br><br>

                <label for="date">Date of Birth:</label>
                <input type="date" id="date" name="date" required><br><br>

                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select><br><br>

                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required><br><br>

                <label for="city">City:</label>
                <input type="text" id="city" name="city" required><br><br>

                <label for="region">Region:</label>
                <input type="text" id="region" name="region" required><br><br>

                <label for="phone">Phone Number:</label>
                <input type="text" id="phone" name="phone" required><br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <button type="submit" id="btn_next">Next</button>
            </form>
            
        </div>
    </div>

<script src="scripts.js"></script>
</body>
</html>
