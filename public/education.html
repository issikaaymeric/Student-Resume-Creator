<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Resume Creation</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" 
  href="data:image/svg+xml,<svg xmlns='http://www.w3.org' viewBox='0 0 512 512'><path fill='%23000' d='M176 56V96H336V56c0-4.4-3.6-8-8-8H184c-4.4 0-8 3.6-8 8zM128 96V56c0-30.9 25.1-56 56-56H328c30.9 0 56 25.1 56 56V96h64c35.3 0 64 28.7 64 64V448c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V160c0-35.3 28.7-64 64-64h64z'/></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="container">
    <div class="page_title">
        <h1>Student Resume Creation</h1>
        <h2>Create Your Professional Resume</h2>
    </div>

    <button id="btn_back" onclick="return_back()">Back</button>

    <h2>Education</h2>
    <p>Tell us about your educational background.</p>

    <div class="education_form">
        <form id="educationForm">
            <label for="diploma">Diploma:</label>
            <input type="text" id="diploma" name="diploma">
            
            <label for="school">School:</label>
            <input type="text" id="school" name="school">
            
            <label for="year">Graduate Year:</label>
            <input type="text" id="year" name="year">

            <button type="submit" id="btn_next">Next</button>
            
        </form>

        <button id="addEducation" onclick="add_education()">Add Education</button>
        <button id="removeEducation" onclick="remove_education()">Remove Education</button>
    </div>
</div>
    <script src="scripts.js"></script>
</body>
</html>
